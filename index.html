<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Генерация ключа доступа | GjhopClient</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none; /* легкая стилизация, но текст ключа можно будет выделить кнопкой */
        }

        body {
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, 'Roboto', sans-serif;
            background: linear-gradient(145deg, #0B1120 0%, #111827 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 1.5rem;
        }

        /* Контейнер для всей логики */
        .app-container {
            width: 100%;
            max-width: 650px;
            margin: 0 auto;
        }

        /* СТИЛИ ДЛЯ ЭКРАНА ЗАГРУЗКИ */
        .loader-screen {
            background: rgba(18, 25, 45, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 2.5rem;
            padding: 2.8rem 2rem;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255,255,255,0.05);
            border: 1px solid rgba(72, 187, 255, 0.2);
            transition: opacity 0.35s ease, visibility 0.35s ease;
            text-align: center;
        }

        .spinner-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }

        .neon-spinner {
            width: 85px;
            height: 85px;
            border: 5px solid rgba(56, 189, 248, 0.2);
            border-top: 5px solid #38bdf8;
            border-right: 5px solid #818cf8;
            border-radius: 50%;
            animation: spin 0.9s cubic-bezier(0.68, -0.35, 0.265, 1.35) infinite;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-text {
            font-size: 1.7rem;
            font-weight: 600;
            background: linear-gradient(135deg, #CBD5E1, #94A3B8);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
        }

        .loader-sub {
            color: #6C86A3;
            font-size: 0.95rem;
            margin-top: 0.25rem;
            font-weight: 400;
            border-top: 1px dashed #2D3A5E;
            padding-top: 1rem;
            display: inline-block;
        }

        /* СТИЛИ ДЛЯ ОСНОВНОГО КОНТЕНТА (появляется после загрузки) */
        .main-content {
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(16px);
            border-radius: 2rem;
            padding: 2.2rem 1.8rem 2.5rem;
            border: 1px solid rgba(56, 189, 248, 0.35);
            box-shadow: 0 30px 40px -20px rgba(0, 0, 0, 0.5);
            transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            animation: fadeSlideUp 0.55s ease-out;
        }

        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .title-key {
            text-align: center;
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(120deg, #E0F2FE, #A5F3FC);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 2rem;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .title-key::before {
            content: "🔑";
            font-size: 1.9rem;
            background: none;
            color: #FBBF24;
        }

        /* ТАБЛИЦА (стилизованная под карточку) */
        .key-table-wrapper {
            display: flex;
            justify-content: center;
            margin: 1.5rem 0 0.8rem;
        }

        .elegant-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            background: #0F172A;
            border-radius: 1.5rem;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255,255,255,0.05);
            border: 1px solid #334155;
        }

        .elegant-table td {
            padding: 1.2rem 1.5rem;
            font-size: 1.2rem;
            font-weight: 500;
            border-bottom: 1px solid #1E293B;
        }

        .elegant-table tr:last-child td {
            border-bottom: none;
        }

        .label-cell {
            background: #1E293B;
            color: #A5B4FC;
            font-weight: 600;
            letter-spacing: 0.3px;
            width: 38%;
            font-size: 1.1rem;
        }

        .key-cell {
            background: #0B1120;
            color: #FACC15;
            font-family: 'Fira Code', 'Cascadia Code', monospace;
            font-weight: 600;
            font-size: 1.25rem;
            word-break: break-all;
            letter-spacing: 0.3px;
        }

        .copy-button {
            background: linear-gradient(95deg, #2563EB, #1E40AF);
            border: none;
            color: white;
            font-family: inherit;
            font-weight: 600;
            padding: 0.65rem 1.5rem;
            border-radius: 60px;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            margin-top: 1.5rem;
        }

        .copy-button:hover {
            background: linear-gradient(95deg, #3B82F6, #2563EB);
            transform: scale(1.02);
            box-shadow: 0 8px 18px rgba(37, 99, 235, 0.4);
        }

        .copy-button:active {
            transform: scale(0.98);
        }

        .copy-feedback {
            margin-left: 12px;
            font-size: 0.85rem;
            font-weight: 400;
            color: #4ADE80;
            transition: opacity 0.2s;
        }

        .button-area {
            display: flex;
            justify-content: center;
            margin-top: 1rem;
        }

        .footer-note {
            text-align: center;
            font-size: 0.75rem;
            color: #5B6E8C;
            margin-top: 1.8rem;
            border-top: 1px solid #1E2A3A;
            padding-top: 1rem;
        }

        /* скрытые классы */
        .hidden {
            display: none;
        }

        /* адаптив */
        @media (max-width: 520px) {
            .elegant-table td {
                padding: 0.9rem 1rem;
                font-size: 1rem;
            }
            .key-cell {
                font-size: 1rem;
            }
            .title-key {
                font-size: 1.6rem;
            }
            .loader-text {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Экран загрузки (видим изначально) -->
    <div id="loaderScreen" class="loader-screen">
        <div class="spinner-wrapper">
            <div class="neon-spinner"></div>
            <div class="loader-text">GjhopClient топ.</div>
            <div class="loader-sub">Создание ключа...</div>
        </div>
    </div>

    <!-- Основной контент (скрыт до окончания загрузки) -->
    <div id="mainContent" class="main-content hidden">
        <div class="title-key">Your key:</div>
        
        <!-- Таблица с ключом -->
        <div class="key-table-wrapper">
            <table class="elegant-table">
                <tr>
                    <td class="label-cell">Ключ софта</td>
                    <td class="key-cell" id="licenseKeyDisplay">GjhopClient_0270</td>
                </tr>
            </table>
        </div>
        
        <!-- Кнопка копирования и зона фидбека -->
        <div class="button-area">
            <button id="copyKeyBtn" class="copy-button">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                Скопировать ключ
            </button>
            <span id="copyFeedback" class="copy-feedback"></span>
        </div>
        <div class="footer-note">
            Скопируй ключ. И вставь ключ в чит (попу)
        </div>
    </div>
</div>

<script>
    (function() {
        // Точное значение ключа по заданию: "GjhopClient_0270"
        const SECRET_KEY = "GjhopClient_0270";
        
        // Элементы DOM
        const loaderScreen = document.getElementById('loaderScreen');
        const mainContent = document.getElementById('mainContent');
        const copyBtn = document.getElementById('copyKeyBtn');
        const copyFeedbackSpan = document.getElementById('copyFeedback');
        const keyDisplaySpan = document.getElementById('licenseKeyDisplay');
        
        // Убедимся, что отображаемый ключ всегда соответствует эталону (безопасно)
        if (keyDisplaySpan) {
            keyDisplaySpan.textContent = SECRET_KEY;
        }
        
        // Таймер на 3 секунды (3000 мс)
        let loadTimeout = null;
        
        // Функция завершения загрузки и отображения контента
        function finishLoadingAndShowContent() {
            // Плавное исчезновение loader (опционально добавим класс прозрачности)
            if (loaderScreen) {
                loaderScreen.style.transition = "opacity 0.4s ease, visibility 0.4s ease";
                loaderScreen.style.opacity = "0";
                loaderScreen.style.visibility = "hidden";
                // Скрыть полностью после анимации
                setTimeout(() => {
                    loaderScreen.classList.add('hidden');
                    loaderScreen.style.display = 'none';  // полное скрытие из потока
                }, 400);
            }
            
            // Показываем основной блок с ключом
            if (mainContent) {
                mainContent.classList.remove('hidden');
                mainContent.style.display = 'block';
                // дополнительно добавляем небольшую задержку для эстетики, но уже всё ок
            }
        }
        
        // Симуляция загрузки (ровно 3 секунды)
        // Но для идеальной отказоустойчивости: если по какой-то причине DOM грузился дольше — таймер всё равно сработает.
        // Используем setTimeout 3000ms
        loadTimeout = setTimeout(() => {
            finishLoadingAndShowContent();
        }, 3000);
        
        // Дополнительно: на случай, если пользователь не дождался и ничего не ломается.
        // Также добавим механизм копирования текста + фидбек
        
        // Функция копирования текста (современный Clipboard API с fallback)
        async function copyKeyToClipboard() {
            const keyToCopy = SECRET_KEY;  // всегда берем константу
            try {
                // Используем современный API буфера обмена
                await navigator.clipboard.writeText(keyToCopy);
                // Показываем успешный фидбек
                if (copyFeedbackSpan) {
                    copyFeedbackSpan.textContent = '✓ Скопировано!';
                    copyFeedbackSpan.style.color = '#4ADE80';
                    // Сбросить через 2.2 секунды
                    setTimeout(() => {
                        if (copyFeedbackSpan) copyFeedbackSpan.textContent = '';
                    }, 2200);
                }
                // Дополнительный визуальный эффект на кнопку (быстрый)
                if (copyBtn) {
                    const originalText = copyBtn.innerHTML;
                    copyBtn.style.transform = 'scale(0.97)';
                    setTimeout(() => { if(copyBtn) copyBtn.style.transform = ''; }, 150);
                }
            } catch (err) {
                // fallback для старых браузеров или если разрешение не дано (но в современных работает)
                console.warn('Clipboard API failed, using fallback', err);
                // Создаем временное текстовое поле
                const textArea = document.createElement('textarea');
                textArea.value = keyToCopy;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                if (copyFeedbackSpan) {
                    copyFeedbackSpan.textContent = '✓ Скопировано (fallback)';
                    copyFeedbackSpan.style.color = '#FBBF24';
                    setTimeout(() => {
                        if (copyFeedbackSpan) copyFeedbackSpan.textContent = '';
                    }, 2200);
                }
            }
        }
        
        // Обработчик нажатия на кнопку копирования
        if (copyBtn) {
            copyBtn.addEventListener('click', (e) => {
                e.preventDefault();
                copyKeyToClipboard();
            });
        }
        
        // Предотвратим случайное преждевременное отображение контента, если скрипт выполнился мгновенно
        // Изначально mainContent скрыт через класс hidden, loader виден.
        // Если по какой-то причине пользователь успел нажать кнопку до окончания загрузки - кнопки еще не существует (не отрендерена),
        // так как mainContent скрыт. Безопасно.
        
        // Дополнительная защита: очистка таймера при размонтировании (но это не React, чисто для гигиены)
        window.addEventListener('beforeunload', () => {
            if (loadTimeout) clearTimeout(loadTimeout);
        });
        
        // На случай если 3 секунды уже прошли еще до полной загрузки DOM? (маловероятно, но добавим проверку)
        // Для идеала - если DOM загрузился позже чем через 3 секунды после старта парсинга, таймер уже вызовет коллбэк.
        // Дополнительно проверяем, что после загрузки страницы не произошло дублирования.
        // В данном сценарии finishLoadingAndShowContent выполнится один раз.
        // Убедимся, что если по какой-то причине finish вызвался дважды - не ломаем интерфейс.
        let alreadyFinished = false;
        const originalFinish = finishLoadingAndShowContent;
        window.finishLoadingAndShowContent = function() {
            if (alreadyFinished) return;
            alreadyFinished = true;
            originalFinish();
        };
        // переопределяем саму функцию, но внутри используется замыкание (в таймере вызовется через 3 секунды оригинал)
        // Обновим ссылку для таймера? Таймер уже сослался на оригинальную функцию finishLoadingAndShowContent до переопределения?
        // Так как таймер был установлен выше, он вызывает старую функцию. Для чистоты мы подменим глобальный указатель, но таймер использует локальную ссылку.
        // Лучше просто блокируем повторный вход внутри самой функции.
        // Перезапишем finishLoadingAndShowContent, чтобы она не выполнялась дважды.
        // Однако, оригинальный таймер уже захватил ссылку на старую функцию в своей области видимости. 
        // Просто добавим флаг в начало самой функции (без переопределения глобально). Сделаем это прямо сейчас:
        let hasContentShown = false;
        const safeFinish = function() {
            if (hasContentShown) return;
            hasContentShown = true;
            // выполняем логику отображения
            if (loaderScreen) {
                loaderScreen.style.transition = "opacity 0.4s ease, visibility 0.4s ease";
                loaderScreen.style.opacity = "0";
                loaderScreen.style.visibility = "hidden";
                setTimeout(() => {
                    if (loaderScreen) {
                        loaderScreen.classList.add('hidden');
                        loaderScreen.style.display = 'none';
                    }
                }, 400);
            }
            if (mainContent) {
                mainContent.classList.remove('hidden');
                mainContent.style.display = 'block';
            }
        };
        
        // Заменяем функцию в таймере? Проще очистить старый таймер и установить новый с безопасной функцией.
        if (loadTimeout) clearTimeout(loadTimeout);
        // Устанавливаем новый таймер с безопасной оберткой
        window._loadTimer = setTimeout(() => {
            safeFinish();
        }, 3000);
        
        // Обработка случая, если пользователь захочет скопировать ключ даже когда он видим — всё работает.
        // Также можно дополнительно добавить подсветку строки таблицы при копировании (необязательно)
        
        // Небольшой трюк: если вдруг скрипт выполнился и 3 секунды уже прошли (например, очень медленный рендер),
        // проверим при загрузке DOM, не нужно ли отобразить контент немедленно.
        // Для этого сохраним время начала загрузки страницы.
        const startTime = Date.now();
        const checkEarlyFinish = () => {
            const elapsed = Date.now() - startTime;
            if (elapsed >= 3000 && !hasContentShown) {
                // если уже прошло 3+ секунды, сразу показываем контент
                safeFinish();
                if (window._loadTimer) clearTimeout(window._loadTimer);
            }
        };
        // Выполним проверку после того, как DOM готов
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                checkEarlyFinish();
            });
        } else {
            checkEarlyFinish();
        }
        
        // Также гарантируем, что в основном контенте корректно отображается нужный ключ (еще раз)
        if (keyDisplaySpan) {
            keyDisplaySpan.textContent = SECRET_KEY;
        }
        
        // стилизовать корректно таблицу, если пользователь захочет выделить мышкой ключ - можно,
        // но кнопка копирования будет удобнее. Добавим возможность выделения текста для удобства
        // так как user-select: none в * мы убрали? В начале CSS есть user-select: none на * - это глобально запрещает выделение.
        // Но для usability лучше разрешить выделение внутри ключа. Исправим стиль: сделаем исключение для .key-cell и кнопки
        const styleOverride = document.createElement('style');
        styleOverride.textContent = `
            .key-cell {
                user-select: text !important;
                cursor: text;
            }
            .copy-button {
                user-select: none;
            }
            .elegant-table td {
                user-select: text;
            }
            .title-key {
                user-select: text;
            }
        `;
        document.head.appendChild(styleOverride);
        
        // инициализация: убеждаемся, что loaderScreen имеет корректный display, а mainContent скрыт
        if (mainContent && !hasContentShown) {
            mainContent.style.display = 'none'; // скрыт изначально (но класс hidden уже делает display: none)
            // дополнительная страховка: у hidden display: none!
        }
        if (loaderScreen) {
            loaderScreen.style.opacity = '1';
            loaderScreen.style.visibility = 'visible';
            loaderScreen.classList.remove('hidden');
            loaderScreen.style.display = 'flex';
        }
        
        // Принудительно финализируем, если таймер по какой-то причине не отработал (но отработает)
        // весь код стабилен.
    })();
</script>
</body>
          </html>
